[project]
name = "mkdocs-sorrow-theme"
version = "0.1.0"
description = "MkDocs theme in the Omarchy Sorrow palette"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "mkdocs>=1.6.1,<2",
]

[project.entry-points."mkdocs.themes"]
sorrow = "mkdocs_sorrow_theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
