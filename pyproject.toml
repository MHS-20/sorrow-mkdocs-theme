[project]
name = "mkdocs-sorrow-theme"
dynamic = ["version"]
description = "MkDocs theme in the Omarchy Sorrow palette"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "mkdocs>=1.6.1,<2",
]
keywords = ["mkdocs", "mkdocs-theme", "theme", "dark", "omarchy", "sorrow"]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: MkDocs",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/MHS-20/sorrow-mkdocs-theme"
Repository = "https://github.com/MHS-20/sorrow-mkdocs-theme"
Issues = "https://github.com/MHS-20/sorrow-mkdocs-theme/issues"

[project.entry-points."mkdocs.themes"]
sorrow = "mkdocs_sorrow_theme"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["mkdocs_sorrow_theme", "LICENSE", "README.md"]

[tool.hatch.version]
source = "vcs"
