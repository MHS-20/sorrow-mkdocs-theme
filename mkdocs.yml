site_name: Sorrow
site_description: A dark MkDocs theme in the palette of the Omarchy Sorrow theme
site_url: https://mhs-20.github.io/sorrow-mkdocs-theme/
nav:
  - Home: index.md
  - Showcase:
      - Typography: showcase/typography.md
      - Code: showcase/code.md
      - Admonitions: showcase/admonitions.md
      - Diagrams: showcase/diagrams.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: false
theme:
  name: sorrow
  mermaid: true
